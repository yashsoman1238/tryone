<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - E-commerce Site</title>
    <style>
        body { font-family: sans-serif; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; }
        button { padding: 10px 20px; }
        #order-summary { margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Checkout</h1>
        <div id="checkout-form">
            <h2>Shipping Details</h2>
            <form id="shipping-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" required>
                </div>
                <button type="submit">Place Order</button>
            </form>
        </div>
        <div id="order-summary">
            <h2>Order Summary</h2>
            <div id="summary-items"></div>
            <p><strong>Total:</strong> $<span id="summary-total">0.00</span></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const summaryItemsContainer = document.getElementById('summary-items');
            const summaryTotalElement = document.getElementById('summary-total');
            const form = document.getElementById('shipping-form');

            // 1. Render the order summary
            function renderOrderSummary() {
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                let total = 0;

                summaryItemsContainer.innerHTML = '';

                if (cart.length === 0) {
                    summaryItemsContainer.innerHTML = '<p>Your cart is empty. <a href="index.html">Continue shopping</a>.</p>';
                    form.style.display = 'none'; // Hide form if cart is empty
                } else {
                    cart.forEach(item => {
                        const itemElement = document.createElement('div');
                        itemElement.textContent = `${item.name} x ${item.quantity} - $${(item.price * item.quantity).toFixed(2)}`;
                        summaryItemsContainer.appendChild(itemElement);
                        total += item.price * item.quantity;
                    });
                }
                summaryTotalElement.textContent = total.toFixed(2);
            }

            // 2. Handle form submission
            form.addEventListener('submit', (event) => {
                event.preventDefault(); // Prevent page reload

                // Basic validation
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const address = document.getElementById('address').value;

                if (!name || !email || !address) {
                    alert('Please fill out all shipping details.');
                    return;
                }

                // Clear the cart
                localStorage.removeItem('cart');

                // Redirect to confirmation page
                window.location.href = 'confirmation.html';
            });

            // Initial render
            renderOrderSummary();
        });
    </script>
</body>
</html>
