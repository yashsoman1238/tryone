<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - E-commerce Site</title>
    <script>
        // Check for auth token. Redirect to login if not found.
        if (!localStorage.getItem('authToken')) {
            window.location.href = 'login.html';
        }
    </script>
    <style>
        body { font-family: sans-serif; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Seller Dashboard</h1>
            <a href="index.html">Back to Shop</a>
        </header>
        <main>
            <h2>My Products</h2>
            <div id="my-products">
                <!-- Products will be listed here by JavaScript -->
            </div>
            <hr>
            <h2>Add a New Product</h2>
            <div id="add-product-form-container">
                <!-- Add product form will go here -->
            </div>
        </main>
    </div>
    <script>
        function renderProducts(products) {
            const container = document.getElementById('my-products');
            container.innerHTML = ''; // Clear existing content

            if (!products || products.length === 0) {
                container.innerHTML = '<p>You have not added any products yet.</p>';
                return;
            }

            const productList = document.createElement('ul');
            productList.style.listStyle = 'none';
            productList.style.padding = '0';

            products.forEach(product => {
                const productItem = document.createElement('li');
                productItem.style.border = '1px solid #ccc';
                productItem.style.padding = '10px';
                productItem.style.marginBottom = '10px';
                productItem.innerHTML = `
                    <strong>${product.name}</strong> - $${product.price}
                    <p>${product.description}</p>
                    <button>Edit</button>
                    <button>Delete</button>
                `;
                productList.appendChild(productItem);
            });
            container.appendChild(productList);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');

            // The script in the <head> should prevent this from running if not logged in.
            if (!token) {
                return;
            }

            fetch('/api/my-products', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (response.status === 401) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                    return;
                }
                if (!response.ok) {
                    throw new Error('Network response was not ok.');
                }
                return response.json();
            })
            .then(products => {
                if (products) {
                    renderProducts(products);
                }
            })
            .catch(error => {
                console.error('There has been a problem with your fetch operation:', error);
                document.getElementById('my-products').innerHTML = '<p>Could not fetch your products.</p>';
            });
        });
    </script>
</body>
</html>
