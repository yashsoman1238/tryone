<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Site</title>
    <style>
        body {
            font-family: sans-serif;
        }
        #products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .product {
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
        }
        .product img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <header style="padding: 10px; text-align: right; border-bottom: 1px solid #ccc; margin-bottom: 20px;">
        <div id="auth-container"></div>
    </header>
    <h1>Welcome to our E-commerce Site!</h1>

    <div id="cart-container">
        <h2>Shopping Cart</h2>
        <div id="cart-items"></div>
        <p><strong>Total:</strong> $<span id="cart-total">0.00</span></p>
        <div id="checkout-button-container" style="display: none; margin-top: 10px;">
            <a href="checkout.html"><button>Checkout</button></a>
        </div>
    </div>

    <hr>

    <div id="products"></div>

    <script>
        let products = [];

        function updateAuthUI() {
            const authContainer = document.getElementById('auth-container');
            const token = localStorage.getItem('authToken');
            const user = JSON.parse(localStorage.getItem('user'));

            if (token && user) {
                authContainer.innerHTML = `
                    <span>Welcome, ${user.email}</span>
                    <button onclick="logout()">Logout</button>
                `;
            } else {
                authContainer.innerHTML = `
                    <a href="login.html">Login</a> | <a href="register.html">Register</a>
                `;
            }
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('user');
            localStorage.removeItem('cart');
            window.location.reload();
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) {
                console.error('Product not found!');
                return;
            }

            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function removeFromCart(productId) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart = cart.filter(item => item.id !== productId);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function updateQuantity(productId, newQuantity) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                const quantity = parseInt(newQuantity, 10);
                if (quantity > 0) {
                    cartItem.quantity = quantity;
                } else {
                    cart = cart.filter(item => item.id !== productId);
                }
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotalElement = document.getElementById('cart-total');
            const checkoutButtonContainer = document.getElementById('checkout-button-container');
            let total = 0;

            cartItemsContainer.innerHTML = ''; // Clear the cart

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p>Your cart is empty.</p>';
                checkoutButtonContainer.style.display = 'none';
            } else {
                checkoutButtonContainer.style.display = 'block';
                cart.forEach(item => {
                    const cartItemElement = document.createElement('div');
                    cartItemElement.classList.add('cart-item');
                    cartItemElement.innerHTML = `
                        <span>${item.name}</span>
                        -
                        <input type="number" value="${item.quantity}" min="1" onchange="updateQuantity(${item.id}, this.value)" style="width: 50px; text-align: center;">
                        x
                        <span>$${item.price}</span>
                        <button onclick="removeFromCart(${item.id})">Remove</button>
                    `;
                    cartItemsContainer.appendChild(cartItemElement);
                    total += item.price * item.quantity;
                });
            }

            cartTotalElement.textContent = total.toFixed(2);
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            renderCart(); // Render cart on page load
            fetch('/api/products')
                .then(response => response.json())
                .then(data => {
                    products = data.products;
                    const productsContainer = document.getElementById('products');
                    products.forEach(product => {
                        const productElement = document.createElement('div');
                        productElement.classList.add('product');
                        productElement.innerHTML = `
                            <img src="${product.image}" alt="${product.name}">
                            <h2>${product.name}</h2>
                            <p>${product.description}</p>
                            <p><strong>Price:</strong> $${product.price}</p>
                            <button onclick="addToCart(${product.id})">Add to Cart</button>
                        `;
                        productsContainer.appendChild(productElement);
                    });
                })
                .catch(error => {
                    console.error('Error fetching products:', error);
                    const productsContainer = document.getElementById('products');
                    productsContainer.innerHTML = '<p>Error loading products. Please try again later.</p>';
                });
        });
    </script>
</body>
</html>
